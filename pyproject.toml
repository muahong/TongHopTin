[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tonghoptin"
version = "1.0.0"
description = "Vietnamese news aggregation tool - collects articles from favourite sites into an HTML digest"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
    "readability-lxml>=0.9",
    "Pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
]

[project.scripts]
tonghoptin = "tonghoptin.cli:main"

[tool.setuptools.packages.find]
include = ["tonghoptin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
