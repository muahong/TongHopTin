name: Validate crawler and reader
on:
  workflow_dispatch:
  push:
    paths:
      - 'tonghoptin/**'
      - 'tests/**'
      - 'requirements*'
      - '.github/workflows/tests.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: node --check tonghoptin/templates/script.js
